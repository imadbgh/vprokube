apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vpro-ingress  # name of the ingress resource
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
spec:
  ingressClassName: nginx
  rules:
  - host: bgh.techbgh.xyz
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: vproapp-service
            port:
              number: 8080 

